[package]
name = "sshstar"
default-run = "sshStar"
version = "0.1.3"
description = "A compact SSH workspace with terminal, SFTP, and AI assistance"
authors = ["sshStar"]
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "sshstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sshStar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
keyring = { version = "3", features = ["windows-native"] }
rig = { version = "0.45", default-features = false, features = ["agent", "reqwest", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The Windows CNG backend bundled by libssh2 cannot authenticate Ed25519
# private keys. Use the OpenSSL backend so modern OpenSSH keys work on Windows
# as they do with the system `ssh` client. Vendoring keeps this independent of
# an OpenSSL installation on the user's machine.
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ssh2 = "0.9"
