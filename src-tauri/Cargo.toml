[package]
name = "portico-ssh"
version = "0.1.0"
description = "A compact SSH workspace with terminal, SFTP, and AI assistance"
authors = ["Portico"]
edition = "2021"

[lib]
name = "portico_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
